services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mqtt
    environment:
      MQTT_WSS_HOSTNAME: ${MQTT_WSS_HOSTNAME}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: admin
    network_mode: host
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
  ui:
    build:
      context: ./machine-ui-heroui-shadcn
      dockerfile: .devcontainer/Dockerfile
    container_name: machine-ui
    env_file:
      - ./env/ui.env
    network_mode: host
    depends_on:
      - caddy
      - mqtt
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_MQTT_LOCAL_BROKER_URI: wss://${MQTT_WSS_HOSTNAME}/mqtt
    volumes:
      # Bind mount the source code for hot-reload
      - ./machine-ui-heroui-shadcn:/workspaces/machine-ui
      # Use a named volume for node_modules to avoid OS conflicts
      - machine-ui-node-modules:/workspaces/machine-ui/node_modules
      # Mount recordings directory
      - /opt/recordings:/opt/recordings
    # Keep container running for development
    stdin_open: true
    tty: true

  bridge:
    build:
      context: ./machine-bridge
      dockerfile: .devcontainer/Dockerfile
    container_name: machine-bridge
    env_file:
      - ./env/bridge.env
    depends_on:
      - mqtt
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./machine-bridge:/workspaces/machine-bridge
      - machine-bridge-node-modules:/workspaces/machine-bridge/node_modules

  vision:
    build:
      context: ./machine-vision
      dockerfile: .devcontainer/Dockerfile
    container_name: machine-vision
    env_file:
      - ./env/vision.env
    network_mode: host
    volumes:
      - ./vision-data:/data
      - /opt/recordings:/opt/recordings
    devices:
      - "/dev:/dev"
    privileged: true
    depends_on:
      - mqtt
      - mongodb



volumes:
  caddy_data:
  caddy_config:
  machine-ui-node-modules:
  machine-bridge-node-modules:
  mongo_data:
